aid: dolby
name: Dolby
description: Dolby Laboratories is an audio and video technology company whose developer platform, Dolby
  OptiView, is the merged surface of the original dolby.io platform, THEO Technologies (THEOplayer, THEOlive,
  THEOads) and Millicast. It ships publicly documented REST APIs for real-time WebRTC streaming, live
  channel orchestration, video playback, server-guided ad insertion and just-in-time ad conformance, alongside
  player SDKs for web, mobile, smart TV, Roku, React Native and Flutter. Dolby is also responsible for
  Dolby Atmos, Dolby Vision and Dolby Digital.
