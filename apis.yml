- aid: dolby:optiview-ad-engine
  name: Dolby OptiView Ad Engine
  description: Just-in-time serverless ad conformance service that transcodes an ad from its master format
    into a streaming format matching the primary content stream. 9 paths / 12 operations, authenticated
    with an x-rasp-auth-token API key.
