note: 'Dolby OptiView has no single shared data model - each product has its own. The most structurally
  important thing an integrator needs to know is the THEOlive V2 component model: a Channel is a container,
  and Ingest -> Engine -> Distribution are separate resources that must each be created and wired by id.
  Creating a working live channel takes four API calls, not one. https://optiview.dolby.com/docs/theolive/api/migration-from-v1/'
id_conventions:
  style: opaque string ids, no type prefixes
  detail: No Stripe-style prefixed identifiers anywhere. THEOlive ids are opaque strings; Millicast mixes
    integer ids (webhooks, tokens) with string ids (media assets, transcoders); the OptiView Ads API uses
    UUIDs.
