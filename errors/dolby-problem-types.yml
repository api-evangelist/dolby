rfc9457: false
note: 'No Dolby OptiView API uses RFC 9457 application/problem+json. Error shape is per-product: Millicast
  returns a {status: ''success''|''fail'', data: {...}} envelope, THEOlive returns bare descriptive strings
  plus a {code, message} MonitoringError on monitoring endpoints, and the OptiView Ads spec declares NO
  error responses at all - only 200/201/204 - so an agent calling Ads has no contract for what a failure
  looks like. That gap is the finding, not an omission in this catalogue. No provider-published error-code
  reference page exists on optiview.dolby.com/docs; the docs sitemap has no error reference for any of
  the REST APIs.'
