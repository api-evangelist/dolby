gaps:
- 'If Dolby did ship an MCP server, the surface is unusually well suited to it: 287 operations across
  five REST APIs, all with per-operation schemas. The blocker is auth, not shape - three different credential
  styles (Basic, Bearer, apiKey) across four products, with no OAuth and therefore no delegated-consent
  story for an agent.'
- The OptiView Ads OpenAPI declares no operationId on any of its 55 operations, so every tool binding
  against it must be by method+path - a real obstacle to generating a stable tool surface.
