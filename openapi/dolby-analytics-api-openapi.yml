                          bytesIn: 0
                      geoCascade:
                        '2020-01-01T00:00:00Z':
                          bytesOut: 10000
                          bytesIn: 0
                        '2020-02-01T00:00:00Z':
                          bytesOut: 100
                          bytesIn: 0
                day:
                  summary: day
                  value:
                    status: success
