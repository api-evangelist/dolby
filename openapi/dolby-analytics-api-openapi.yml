openapi: 3.2.0
info:
  title: Dolby Analytics API
  version: 1.0.0
  description: 'Operations tagged Analytics across 2 of this provider''s published API definitions: dolby-millicast-analytics-openapi-original.json, dolby-millicast-api-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://analyticsapi.millicast.com
- url: https://api.millicast.com
security:
- API_Secret: []
tags:
- name: Analytics
  description: Viewer connection analytics records
paths:
  /api/records/viewers:
    post:
      tags:
      - Analytics
      summary: Viewer Records
      description: 'Returns a range of viewer connection records, with optional start-time and completion-time filters. Includes ongoing (not yet completed) connections by default. Each ClientId appears as a single record. If a session reconnects after being marked complete, it is returned as one record with duration and bytes accumulated from the original session start.


        To poll for new or updated records, set StartTime to your last checkpoint and advance it on each call. Dedupe results by ClientId.


        To fetch completed records up to a point in time, set Search=Completed with EndTime as the upper bound on completion time. EndTime is one-sided: repeated calls with the same EndTime return every record completed before that time each time, not only the ones newly completed since your last call. Do not use this for non-overlapping usage or billing tallies - use v2''s CompletedAfter/CompletedBefore for that.'
      operationId: Records_GetViewerRecords
      requestBody:
        x-name: model
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetRecordsModel'
        required: true
        x-position: 1
      responses:
        '200':
          description: Success
          content:
            application/x-jsonl:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewerRecordModelV1'
              examples:
                ? ''
                : summary: ''
                  value: '{"startTime":"2023-01-01T00:30:00.000Z","endTime":"2023-01-01T01:00:00.000Z","clientId":"ffffffff-ffff-ffff-ffff-ffffffffffff","clusterId":"phx-1","country":"US","duration":1800,"bytes":450000000,"ipAddress":"127.0.0.1","streamName":"teststream","trackingId":null,"userAgent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Safari/537.36"}'
            text/csv:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewerRecordModelV1'
              examples:
                ? ''
                : summary: ''
                  value: 'StartTime,EndTime,ClientId,ClusterId,Country,Duration,Bytes,IpAddress,StreamName,TrackingId,UserAgent

                    2023-01-01T00:30:00.000Z,2023-01-01T01:00:00.000Z,ffffffff-ffff-ffff-ffff-ffffffffffff,phx-1,US,1800,450000000,127.0.0.1,teststream,,"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Safari/537.36"

                    '
      security:
      - API_Secret: []
    servers:
    - url: https://analyticsapi.millicast.com
  /api/analytics/account/total:
    get:
      tags:
      - Analytics
      summary: Account Total
      description: Get total usage on account over a date range.
      operationId: Analytics_AccountTotal
      parameters:
      - name: startDate
        in: query
        required: true
        description: The start date of the query. In the format of `YYYY-MM-DD`.
        schema:
          type: string
          format: date
        x-position: 1
      - name: stopDate
        in: query
        required: true
        description: The exclusive end of the date range for the query. Data is returned up to, but not including, this date. In the format of `YYYY-MM-DD`. ISO 8601 format is also supported (e.g., 2021-02-01T00:00:00Z).
        schema:
          type: string
          format: date
        x-position: 2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAccountBandwidthTotalAnalyticModel'
              examples:
                simple:
                  summary: simple
                  value:
                    status: success
                    data:
                      bytesOut: 250000
                      bytesIn: 500000000
                      standardStream:
                        bytesOut: 100000
                        bytesIn: 500000000
                      restream:
                        secondsUsed: 10
                        bytesOut: 50000
                        bytesIn: 0
                      geoCascade:
                        bytesOut: 100000
                        bytesIn: 0
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailResponse'
        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                general:
                  summary: general
                  value:
                    status: error
                    message: simple error reason
                    code: 500
                    data:
                      additional: other data here (not actual key)
      security:
      - API_Secret: []
      x-codeSamples:
      - lang: curl
        source: "curl -H \"Authorization: Bearer your_api_secret\" \\\n     -H \"Content-Type: application/json\" \\\n     https://api.millicast.com/api/analytics/account/total \\\n     -G -d \"startDate=2020-01-01&stopDate=2020-04-01\""
    servers:
    - url: https://api.millicast.com
