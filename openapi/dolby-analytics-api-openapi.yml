                      bandwidth:
                        '2020-03-01T00:00:00Z':
                          bytesOut: 20150
                          bytesIn: 5000
                        '2020-03-02T00:00:00Z':
                          bytesOut: 400
                          bytesIn: 50
                      standardStream:
                        '2020-03-01T00:00:00Z':
                          bytesOut: 10000
                          bytesIn: 5000
                        '2020-03-02T00:00:00Z':
                          bytesOut: 100
                          bytesIn: 50
                      restream:
                        '2020-03-01T00:00:00Z':
                          secondsUsed: 10
