                          bytesIn: 0
                        '2020-03-02T00:00:00Z':
                          secondsUsed: 12
                          bytesOut: 200
                          bytesIn: 0
                      geoCascade:
                        '2020-03-01T00:00:00Z':
                          bytesOut: 10000
                          bytesIn: 0
                        '2020-03-02T00:00:00Z':
                          bytesOut: 100
                          bytesIn: 0
                hour:
                  summary: hour
                  value:
                    status: success
                    data:
                      bandwidth:
                        '2020-03-01T00:00:00Z':
                          bytesOut: 20150
                          bytesIn: 5000
                        '2020-03-01T01:00:00Z':
                          bytesOut: 400
                          bytesIn: 50
                      standardStream:
                        '2020-03-01T00:00:00Z':
                          bytesOut: 10000
                          bytesIn: 5000
                        '2020-03-01T01:00:00Z':
                          bytesOut: 100
                          bytesIn: 50
                      restream:
                        '2020-03-01T00:00:00Z':
                          secondsUsed: 10
                          bytesOut: 150
                          bytesIn: 0
                        '2020-03-01T01:00:00Z':
                          secondsUsed: 12
                          bytesOut: 200
                          bytesIn: 0
                      geoCascade:
                        '2020-03-01T00:00:00Z':
