openapi: 3.2.0
info:
  title: Dolby OptiView Ad Engine Cloud Preview API
  version: 1.0.0
servers:
- url: https://api.galaxy.dolbyrasp.com
tags:
- name: Cloud Preview
paths:
  /media-info:
    get:
      operationId: media-info
      tags:
      - Cloud Preview
      summary: Media Info
      responses:
        '200':
          description: OK
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          format: uri
        description: URL of the media file
      - name: credentials_key
        in: query
        required: false
        schema:
          type: string
        description: The key of the stored credentials to use when accessing the URL.
      - name: x-rasp-auth-token
        in: header
        required: true
        schema:
          type: string
        description: Authentication token.
      x-displayName: Media Info
      security:
      - ApiKeyAuth: []
  /image:
    get:
      operationId: image
      tags:
      - Cloud Preview
      summary: Image
      responses:
        '200':
          description: OK
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          format: uri
        description: URL of the media file
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - png
          - jpeg
          default: jpeg
        description: The image format to return
      - name: width
        in: query
        required: false
        schema:
          type: integer
          minimum: 16
          maximum: 3840
        description: The width of the image in pixels. If not specified, will be calcualted based on the source dimension.
      - name: height
        in: query
        required: false
        schema:
          type: integer
          minimum: 16
          maximum: 2160
        description: The height of the image in pixels. If not specified, will be calcualted based on the source dimension.
      - name: offset_percent
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          maximum: 100
          default: 10
        description: The percentage offset into the video to capture the image from.
      - name: credentials_key
        in: query
        required: false
        schema:
          type: string
        description: The key of the stored credentials to use when accessing the URL.
      - name: x-rasp-auth-token
        in: header
        required: true
        schema:
          type: string
        description: Authentication token.
      x-displayName: Image
      security:
      - ApiKeyAuth: []
  /cloud-preview/codemill:
    post:
      tags:
      - Cloud Preview
      operationId: cloud-preview-codemill
      summary: Cloud Preview - Codemill
      description: Generates Accurate Player templates for instant cloud asset media playback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/codemill_explicit_outputs'
              - $ref: '#/components/schemas/codemill_implicit_templates'
            examples:
              explicit:
                summary: Explicit output configuration
                value:
                  urls:
                  - url: https://my_server/my_folder/tears_of_steel.mov
                    id: v0
                  - url: https://my_server/my_folder/tears_of_steel_english.mov
                    id: a0
                  - url: https://my_server/my_folder/tears_of_steel_italian.mov
                    id: a1
                  - url: https://my_server/my_folder/tears_of_steel_french_subs.srt
                    id: s0
                  map:
                    video:
                    - url_id: v0
                      track_idx: 0
                    audio:
                    - url_id: a0
                      track_idx: 0
                    - url_id: a1
                      track_idx: 0
                    subtitle:
                    - url_id: s0
                      track_idx: 0
                  outputs:
                  - encode_profile:
                      container:
                        kind: hls/fmp4
                      video:
                        height: 1080
                        bitrate_mode: vbr
                        bitrate_kb: 2500
                        max_bitrate_kb: 3500
                        codec: h264
                        preset: veryfast
                      audio:
                      - program_name: en_stereo
                        codec: aac
                        bitrate_kb: 128
                        channels: 2
                        track_selector:
                          track_idx: 0
                      - program_name: it_stereo
                        codec: aac
                        bitrate_kb: 128
                        channels: 2
                        track_selector:
                          track_idx: 1
                      subtitle:
                      - program_name: french-subs
                        track_selector:
                          track_idx: 0
                  options:
                    use_source_start_time_code: true
              implicit:
                summary: Implicit template inference
                value:
                  urls:
                  - url: https://my_server/my_folder/tears_of_steel.mov
                  - url: https://my_server/my_folder/tears_of_steel_english.mov
                  - url: https://my_server/my_folder/tears_of_steel_italian.mov
                  - url: https://my_server/my_folder/tears_of_steel_french_subs.srt
                  profile_templates:
                  - type: video
                    name: sdr
                    selectors:
                    - range: sdr
                    - range: dolby_vision_5
                    - range: dovi_mezzanine
                    - range: dovi_mezzanine_xml
                    - range: hdr10
                    profile:
                      video:
                        height: 720
                        width: 1280
                        bitrate_mode: crf
                        crf: 19
                        max_bitrate_kb: 8000
                        codec: h264
                        range: sdr
                        preset: veryfast
                  - type: audio
                    selectors:
                    - channels: 1
                    profile:
                      audio:
                        codec: aac
                        bitrate_kb: 96
                        channels: 1
                  - type: audio
                    selectors:
                    - channels: 2
                    profile:
                      audio:
                        codec: aac
                        bitrate_kb: 128
                        channels: 2
                  - type: audio
                    selectors:
                    - channels: 6
                    profile:
                      audio:
                        codec: aac
                        bitrate_kb: 256
                        channels: 6
                  - type: subtitle
                    selectors:
                    - codec_name: '*'
                    profile:
                      subtitle: {}
                  options:
                    use_source_start_time_code: true
      responses:
        '200':
          description: OK
      x-displayName: Codemill
      parameters:
      - name: x-rasp-auth-token
        in: header
        required: true
        schema:
          type: string
        description: Authentication token.
      security:
      - ApiKeyAuth: []
