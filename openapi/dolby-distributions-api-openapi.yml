openapi: 3.2.0
info:
  title: THEOlive Distributions API
  version: v2
servers:
- url: https://api.theo.live/v2
  description: V2 API
- url: https://api.theo.live
  description: Base (for /v1 endpoints)
security:
- BasicAuth: []
tags:
- name: Distributions
paths:
  /channels/{id}/distributions:
    get:
      tags:
      - Distributions
      operationId: get-channel-distributions
      summary: Get distributions of a channel
      description: Distributions are ordered alphabetically by name.
      parameters:
      - schema:
          type: string
          description: Channel ID
        required: true
        description: Channel ID
        name: id
        in: path
      - schema:
          type: string
          description: Pagination cursor
        required: false
        description: Pagination cursor
        name: cursor
        in: query
      - schema:
          type:
          - number
          - 'null'
          maximum: 100
          description: Maximum number of items to return (max 100)
        required: false
        description: Maximum number of items to return (max 100)
        name: limit
        in: query
      responses:
        '200':
          description: List of distributions, ordered alphabetically by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDistributionResult'
    post:
      tags:
      - Distributions
      operationId: create-channel-distribution
      summary: Create a distribution for a channel
      parameters:
      - schema:
          type: string
          description: Channel ID
        required: true
        description: Channel ID
        name: id
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDistributionBody'
      responses:
        '200':
          description: Distribution created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionObjectResult'
  /distributions/{id}:
    get:
      tags:
      - Distributions
      operationId: get-distribution
      summary: Get a distribution by ID
      parameters:
      - schema:
          type: string
          description: Distribution ID
        required: true
        description: Distribution ID
        name: id
        in: path
      responses:
        '200':
          description: The requested distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionObjectResult'
    patch:
      tags:
      - Distributions
      operationId: update-distribution
      summary: Update a distribution by ID
      parameters:
      - schema:
          type: string
          description: Distribution ID
        required: true
        description: Distribution ID
        name: id
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDistributionBody'
      responses:
        '200':
          description: Updated distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionObjectResult'
    delete:
      tags:
      - Distributions
      operationId: delete-distribution
      summary: Delete a distribution by ID
      parameters:
      - schema:
          type: string
          description: Distribution ID
        required: true
        description: Distribution ID
        name: id
        in: path
      responses:
        '204':
          description: Empty response
  /distributions/{id}/security/keys:
    get:
      tags:
      - Distributions
      operationId: get-distribution-security-keys
      summary: Get security keys of a distribution
      parameters:
      - schema:
          type: string
          description: Distribution ID
        required: true
        description: Distribution ID
        name: id
        in: path
      responses:
        '200':
          description: List of security keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionSecurityKeyListResult'
    post:
      tags:
      - Distributions
      operationId: create-distribution-security-key
      summary: Add a security key to a distribution
      parameters:
      - schema:
          type: string
          description: Distribution ID
        required: true
        description: Distribution ID
        name: id
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDistributionSecurityKeyBody'
      responses:
        '200':
          description: Security key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionSecurityKeyObjectResult'
    delete:
      tags:
      - Distributions
      operationId: delete-all-distribution-security-keys
      summary: Delete all security keys of a distribution
      parameters:
      - schema:
          type: string
          description: Distribution ID
        required: true
        description: Distribution ID
        name: id
        in: path
      responses:
        '204':
          description: Empty response
  /distributions/{id}/security/keys/{keyId}:
    get:
      tags:
      - Distributions
      operationId: get-distribution-security-key
      summary: Get a specific security key
      parameters:
      - schema:
          type: string
          description: Distribution ID
        required: true
        description: Distribution ID
        name: id
        in: path
      - schema:
          type: string
          description: Security key ID
        required: true
        description: Security key ID
        name: keyId
        in: path
      responses:
        '200':
          description: The requested security key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionSecurityKeyObjectResult'
    delete:
      tags:
      - Distributions
      operationId: delete-distribution-security-key
      summary: Delete a specific security key
      parameters:
      - schema:
          type: string
          description: Distribution ID
        required: true
        description: Distribution ID
        name: id
        in: path
      - schema:
          type: string
          description: Security key ID
        required: true
        description: Security key ID
        name: keyId
        in: path
      responses:
        '204':
          description: Empty response
  /distributions/{id}/analytics/viewing-minutes:
