components:
  schemas:
    DistributionSecurityKeyObjectResult:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              description: Security key ID
            name:
              type: string
              description: Security key name
          required:
          - id
          description: Security key object
      required:
      - data
    ViewersInsightsListResult:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                description: Timestamp of the data point
              amount:
                type: number
                description: Number of unique viewers
            required:
            - timestamp
            - amount
          description: List of viewer count data points
      required:
      - data
    ViewingCountryListResult:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              countryCode:
                type: string
                description: ISO country code
              amount:
                type: number
                description: Metric value
            required:
            - countryCode
            - amount
          description: List of country viewing data
      required:
      - data
    CreateDistributionSecurityKeyBody:
      type: object
      properties:
        name:
          type: string
          description: Name of the security key
        key:
          type: string
          description: Security key value
      required:
      - key
      additionalProperties: false
    BrowserOsInsightsListResult:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              browserName:
                type: string
                description: Browser name
              browserVersion:
                type: string
                description: Browser version
              osName:
                type: string
                description: OS name
              osVersion:
                type: string
                description: OS version
              amount:
                type: number
                description: Number of unique viewers
            required:
            - browserName
            - browserVersion
            - osName
            - osVersion
            - amount
          description: List of browser/OS insights
      required:
      - data
    CountryInsightsListResult:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              city:
                type: string
                description: City name
              countryCode:
                type: string
                description: ISO country code
              geoLocation:
                type: string
                description: Rounded latitude,longitude
              amount:
                type: number
                description: Number of unique viewers
            required:
            - city
            - countryCode
            - geoLocation
            - amount
          description: List of country insights
      required:
      - data
    UpdateDistributionBody:
      type: object
      properties:
        name:
          type: string
          description: Name of the distribution
        externalId:
          type:
          - string
          - 'null'
          description: External identifier for the distribution. Set to null to clear.
        enabled:
          type: boolean
          description: Whether the distribution is enabled
        targetLatency:
          type: number
          description: 'Deprecated: use latencies.hesp instead.'
        latencies:
          type:
          - object
          - 'null'
          properties:
            hesp:
              type:
              - number
              - 'null'
              minimum: 1
              maximum: 30
              description: 'HESP latency in seconds (1-30, default: 2)'
            hls:
              type:
              - number
              - 'null'
              minimum: 6
              maximum: 30
              description: 'HLS latency in seconds (6-30, default: 10)'
          description: Latency configuration per output protocol
        security:
          type: object
          properties:
            geoBlocking:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether geo-blocking is enabled
                mode:
                  type: string
                  enum:
                  - allow
                  - deny
                  description: Geo-blocking mode
                countries:
                  type: array
                  items:
                    type: string
                  description: List of country codes
              description: Geo-blocking configuration
            ipBlocking:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether IP blocking is enabled
                mode:
                  type: string
                  enum:
                  - allow
                  - deny
                  description: IP blocking mode
                cidrs:
                  type: array
                  items:
                    type: string
                  description: List of CIDR ranges
              description: IP blocking configuration
            refererBlocking:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether referer blocking is enabled
                allowedDomains:
                  type: array
                  items:
                    type: string
                  description: List of allowed domains. Matched exactly against the referer host including port (e.g. example.com). `localhost` with an optional port (e.g. localhost:3000) is also allowed.
                allowNativeApps:
                  type: boolean
                  description: Whether native apps are allowed
              description: Referer blocking configuration
            rewriteSegmentUrls:
              type: boolean
              description: When enabled, a short-lived token is added to the segment URLs, derived from the token that was passed. This only works when JWT security is enabled on the same distribution.
            keys:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Name of the security key
                  key:
                    type: string
                    description: Security key value
                required:
                - key
              maxItems: 2
              description: Security keys (max 2, create only)
          description: Security configuration
        endpoints:
          type: object
          properties:
            engineIds:
              type: array
              items:
                type: string
              description: Engine IDs to connect
          description: Endpoint configuration
        webRtc:
          type:
          - object
          - 'null'
          properties:
            priority:
              type: number
              description: WebRTC priority
            src:
              type: object
              properties:
                name:
                  type: string
                  description: WebRTC source name
                accountId:
                  type: string
                  description: WebRTC account ID
                apiUrl:
                  type: string
                  description: WebRTC API URL
              required:
              - name
              - accountId
              - apiUrl
              description: WebRTC source configuration
          required:
          - priority
          - src
          description: WebRTC configuration
        outputs:
          type: object
          properties:
            hesp:
              type: boolean
              default: true
              description: Enable HESP output. Enabled by default.
            hls:
              type: boolean
              default: true
              description: Enable HLS output. Enabled by default.
            hlsMpegTs:
              type: boolean
              default: false
              description: Enable HLS MPEG-TS output. Disabled by default.
          description: Output format configuration
        maxBitrate:
          type:
