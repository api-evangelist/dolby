      - MediaDistributions
      summary: Create Media Distribution
      description: Creates a new media distribution for viewing HLS media assets.
      operationId: MediaDistributions_CreateMediaDistribution
      requestBody:
        x-name: model
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaDistributionModel'
        required: true
        x-position: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseOfMediaDistributionResponseModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailResponse'
        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - API_Secret: []
    get:
      tags:
      - MediaDistributions
      summary: List Media Distributions
      description: List all media distributions with specific sorting and pagination.
      operationId: MediaDistributions_ListMediaDistribution
      parameters:
      - name: sort
        in: query
        schema:
          default: createdAt
          oneOf:
          - $ref: '#/components/schemas/ListMediaDistributionsSortBy'
        x-position: 1
      - name: name
        in: query
        description: Optional. Case insensitive.
        schema:
          type:
          - string
          - 'null'
        x-position: 2
      - name: default
        in: query
        schema:
          type:
          - boolean
          - 'null'
        x-position: 3
      - name: cursor
        in: query
        description: Used for pagination. Do not include on the first request. For subsequent requests use the pagination.cursor field from the previous response. You must use the same sort option when requesting each page
        schema:
          type:
          - string
          - 'null'
          default: ''
        x-position: 4
      - name: limit
        in: query
        description: The maximum number of objects returned
        schema:
          type: integer
          default: 25
          maximum: 100.0
          minimum: 1.0
        x-position: 5
      - name: desc
        in: query
        schema:
          type: boolean
          default: false
        x-position: 6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseOfPaginationResponseOfMediaDistributionResponseModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailResponse'
        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - API_Secret: []
  /api/v3/media/distributions/{id}:
    get:
      tags:
      - MediaDistributions
      summary: Read Media Distribution
      description: Gets media distribution specified by mediaDistributionId.
      operationId: MediaDistributions_ReadMediaDistribution
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseOfMediaDistributionResponseModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailResponse'
        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - API_Secret: []
    patch:
      tags:
      - MediaDistributions
      summary: Update Media Distribution
      description: Update media distribution settings.
      operationId: MediaDistributions_UpdateMediaDistribution
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        x-position: 1
      requestBody:
        x-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMediaDistribution'
        required: true
        x-position: 2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseOfMediaDistributionResponseModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailResponse'
        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - API_Secret: []
    delete:
      tags:
      - MediaDistributions
      summary: Delete Media Distribution
      description: Deletes media distribution specified by a mediaDistributionId.
      operationId: MediaDistributions_DeleteMediaDistribution
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        x-position: 1
      responses:
        '204':
          description: Empty Response
        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                general:
                  summary: general
                  value:
