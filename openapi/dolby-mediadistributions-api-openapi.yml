      summary: Delete a media distribution security key
      operationId: MediaDistributions_DeleteSecurityKey
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        x-position: 1
      - name: keyId
        in: path
        required: true
        schema:
          type: string
