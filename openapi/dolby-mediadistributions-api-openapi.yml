      security:
      - API_Secret: []
  /api/v3/media/distributions/{id}/security/keys:
    get:
      tags:
      - MediaDistributions
      summary: Get all security keys of a media distribution by ID
      operationId: MediaDistributions_GetSecurityKeys
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseOfListOfSecurityKeyResponseModel'
        '400':
          description: Bad Request
          content:
            application/json:
