        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - API_Secret: []
components:
  schemas:
    UpdateMediaDistribution:
      type: object
      additionalProperties: false
      properties:
        name:
          type:
          - string
          - 'null'
          description: User-friendly name for the media distribution.
          maxLength: 128
          minLength: 1
        default:
          type:
          - boolean
          - 'null'
          description: Set this as the default media distribution that will be associated with all future media assets created without an explicit mediaDistributionId set.
    MediaDistributionResponseModel:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          description: User-friendly name for the media distribution. The '*' character is not allowed
          maxLength: 128
          minLength: 1
        default:
          type: boolean
          description: Set this as the default media distribution that will be associated with all future media assets created without an explicit MediaDistributionId set.
        id:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        security:
          description: Security settings for your media distribution.
          oneOf:
          - $ref: '#/components/schemas/MediaDistributionSecurityResponse'
    MediaDistributionSecurityRequest:
      type: object
      additionalProperties: false
      properties:
        keys:
          type:
          - array
          - 'null'
          description: Security keys that can be used to sign a JWT to authenticate media asset views. If no keys are provided the media distribution will be unsecured. This means any associated assets can be viewed without a token, and if a token is provided the signing key will not be validated. If a key is specified the media distribution will be secured and a valid token signed with one of the provided keys will be required to view associated media assets.
          maxItems: 2
          items:
            $ref: '#/components/schemas/SecurityKeyRequestModel'
    SuccessResponseOfListOfSecurityKeyResponseModel:
      type: object
      additionalProperties: false
      required:
      - status
      - data
      properties:
        status:
          type: string
          default: success
          minLength: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/SecurityKeyResponseModel'
    FailResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - data
      properties:
        status:
          type: string
          default: fail
          minLength: 1
        data: {}
    SecurityKeyRequestModel:
      type: object
      additionalProperties: false
      required:
      - key
      properties:
        name:
          type:
          - string
          - 'null'
          description: Name for the security key.
          maxLength: 128
          minLength: 1
        key:
          type: string
          maxLength: 4096
          minLength: 32
    ListMediaDistributionsSortBy:
      type: string
      description: ''
      x-enumNames:
      - CreatedAt
      - Name
      enum:
      - createdAt
      - name
    CreateMediaDistributionModel:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          description: User-friendly name for the media distribution. The '*' character is not allowed
          maxLength: 128
          minLength: 1
        default:
          type: boolean
          description: Set this as the default media distribution that will be associated with all future media assets created without an explicit MediaDistributionId set.
        security:
          description: Optional. Specify security settings for your media distribution.
          oneOf:
          - $ref: '#/components/schemas/MediaDistributionSecurityRequest'
    SuccessResponseOfPaginationResponseOfMediaDistributionResponseModel:
      type: object
      additionalProperties: false
      required:
      - status
      - data
      properties:
        status:
          type: string
          default: success
          minLength: 1
        data:
          $ref: '#/components/schemas/PaginationResponseOfMediaDistributionResponseModel'
    SuccessResponseOfSecurityKeyResponseModel:
      type: object
      additionalProperties: false
      required:
      - status
      - data
      properties:
        status:
          type: string
          default: success
          minLength: 1
        data:
          $ref: '#/components/schemas/SecurityKeyResponseModel'
    MediaDistributionSecurityResponse:
      type: object
      additionalProperties: false
      properties:
        keys:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SecurityKeyResponseModel'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - message
      properties:
        status:
          type: string
          default: error
          minLength: 1
        message:
          type: string
          minLength: 1
        code:
          type:
          - integer
          - 'null'
          format: int32
        data: {}
    PaginationResponseOfMediaDistributionResponseModel:
      type: object
      additionalProperties: false
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MediaDistributionResponseModel'
        pagination:
          oneOf:
          - $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      additionalProperties: false
      properties:
        hasMore:
          type: boolean
        cursor:
          type:
          - string
          - 'null'
    SecurityKeyResponseModel:
      type: object
      additionalProperties: false
      properties:
        id:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
    SuccessResponseOfMediaDistributionResponseModel:
      type: object
      additionalProperties: false
      required:
      - status
      - data
      properties:
        status:
          type: string
          default: success
          minLength: 1
        data:
          $ref: '#/components/schemas/MediaDistributionResponseModel'
  securitySchemes:
    API_Secret:
      type: http
      description: '### Usage

        #### Acquire secret from dashboard.

        * Login to the streaming dashboard

        * On the left menu, click on Settings

        * Navigate to the Security tab''s sub section API Secrets

        1. "+ Create" to generate a new named API Secret if needed

        2. Click on the copy button or the reveal button to access a previously created API Secret


        ![](../assets/api_secret.png "Find API Secret")'
      scheme: bearer
