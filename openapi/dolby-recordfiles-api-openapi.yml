openapi: 3.2.0
info:
  title: Millicast Record Files API
  description: '# Introduction

    Controlling publishing for your Millicast account.'
  version: 1.0.0
servers:
- url: https://api.millicast.com
security:
- API_Secret: []
tags:
- name: RecordFiles
paths:
  /api/record_files/{recordFileId}:
    get:
      tags:
      - RecordFiles
      summary: Read File
      description: '**Please refer to Read Media Assets**


        Gets file specified by record file id. Includes temporary download link.'
      operationId: RecordFiles_GetRecordFile
      parameters:
      - name: recordFileId
        in: path
        required: true
        schema:
          type: integer
        x-position: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessRecordFileModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailResponse'
        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                general:
                  summary: general
                  value:
                    status: error
                    message: simple error reason
                    code: 500
                    data:
                      additional: other data here (not actual key)
      deprecated: true
      security:
      - API_Secret: []
    delete:
      tags:
      - RecordFiles
      summary: Delete File
      description: '**Please refer to Delete Media Assets**


        Deletes recorded file from storage.'
      operationId: RecordFiles_DeleteRecordFile
      parameters:
      - name: recordFileId
        in: path
        required: true
        schema:
          type: integer
        x-position: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseBoolean'
        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                general:
                  summary: general
                  value:
                    status: error
                    message: simple error reason
                    code: 500
                    data:
                      additional: other data here (not actual key)
      deprecated: true
      security:
      - API_Secret: []
  /api/record_files/delete:
    post:
      tags:
      - RecordFiles
      summary: Delete Files
      description: '**Please refer to Delete Media Assets**


        Deletes multiple recorded file from storage.'
      operationId: RecordFiles_DeleteRecordFiles
      requestBody:
        x-name: recordFiles
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveRecordFilesModel'
        required: true
        x-position: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseBoolean'
        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                general:
                  summary: general
                  value:
                    status: error
                    message: simple error reason
                    code: 500
                    data:
                      additional: other data here (not actual key)
      deprecated: true
      security:
      - API_Secret: []
  /api/record_files/delete/all:
    post:
      tags:
      - RecordFiles
      summary: Delete All Files
      description: '**Please refer to Delete All Media Assets**


        Deletes all recorded files from storage.'
      operationId: RecordFiles_DeleteAllRecordFiles
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseBoolean'
        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                general:
                  summary: general
                  value:
                    status: error
                    message: simple error reason
                    code: 500
                    data:
                      additional: other data here (not actual key)
      deprecated: true
      security:
      - API_Secret: []
  /api/record_files/list:
    get:
      tags:
      - RecordFiles
      summary: List Files
      description: '**Please refer to List Media Assets**


        List files for account with specific sorting and pagination. If response array is empty, you have reached the end of the list ordering.'
      operationId: RecordFiles_ListRecordFiles
      parameters:
      - name: sortBy
        in: query
        schema:
          default: RecordedOn
          oneOf:
          - $ref: '#/components/schemas/ListSortBy3'
        x-position: 1
      - name: status
        in: query
        style: form
        explode: true
        schema:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FilterByRecordFileStatus'
        x-position: 2
      - name: page
        in: query
        required: true
        description: The index to start when paginating results.
        schema:
          type: integer
          format: int32
          maximum: 2147483647.0
          minimum: 1.0
        x-position: 3
      - name: itemsOnPage
        in: query
        required: true
        description: The number of results to include when paginating a large result set.
        schema:
          type: integer
          format: int32
          maximum: 100.0
          minimum: 1.0
        x-position: 4
      - name: isDescending
        in: query
        description: Change the direction of the default sort ordering.
        schema:
          type: boolean
          default: false
        x-position: 5
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessListRecordFileModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailResponse'
        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                general:
                  summary: general
                  value:
                    status: error
                    message: simple error reason
                    code: 500
                    data:
                      additional: other data here (not actual key)
      deprecated: true
      security:
      - API_Secret: []
  /api/record_files/list_by_token:
    get:
      tags:
      - RecordFiles
      summary: List Files By Token
      description: '**Please refer to List Media Assets and query using the `tokenId` parameter**


        List files using a token with specific sorting and pagination. If response array is empty, you have reached the end of the list ordering.'
      operationId: RecordFiles_ListRecordFilesByToken
      parameters:
      - name: token
        in: query
        required: true
        description: Either token or tokenId must be specified.
        schema:
          type:
          - string
          - 'null'
        x-position: 1
      - name: tokenId
        in: query
        description: Either token or tokenId must be specified. Legacy name token_id.
        schema:
          type:
          - integer
          - 'null'
        x-position: 2
      - name: sortBy
        in: query
        schema:
          default: RecordedOn
          oneOf:
          - $ref: '#/components/schemas/ListSortBy3'
        x-position: 3
      - name: status
        in: query
        style: form
        explode: true
        schema:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FilterByRecordFileStatus'
        x-position: 4
      - name: page
        in: query
        required: true
        description: The index to start when paginating results.
        schema:
          type: integer
          format: int32
          maximum: 2147483647.0
          minimum: 1.0
        x-position: 5
      - name: itemsOnPage
        in: query
        required: true
        description: The number of results to include when paginating a large result set.
        schema:
          type: integer
          format: int32
          maximum: 100.0
          minimum: 1.0
        x-position: 6
      - name: isDescending
        in: query
        description: Change the direction of the default sort ordering.
        schema:
          type: boolean
          default: false
        x-position: 7
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessListRecordFileModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailResponse'
        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                general:
                  summary: general
                  value:
                    status: error
                    message: simple error reason
                    code: 500
                    data:
                      additional: other data here (not actual key)
      deprecated: true
      security:
      - API_Secret: []
  /api/record_files/list_by_stream:
    get:
      tags:
      - RecordFiles
      summary: List Files By Stream
      description: '**Please refer to List Media Assets and query using the `streamName`parameter**


        List files using a streamname with specific sorting and pagination. If response array is empty, you have reached the end of the list ordering.'
      operationId: RecordFiles_ListRecordFilesByStream
      parameters:
      - name: streamname
        in: query
        required: true
        schema:
          type:
          - string
          - 'null'
          maxLength: 128
        x-position: 1
      - name: sortBy
        in: query
        schema:
          default: RecordedOn
          oneOf:
          - $ref: '#/components/schemas/ListSortBy3'
        x-position: 2
      - name: status
        in: query
        style: form
        explode: true
        schema:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FilterByRecordFileStatus'
        x-position: 3
      - name: page
        in: query
        required: true
        description: The index to start when paginating results.
        schema:
          type: integer
          format: int32
          maximum: 2147483647.0
          minimum: 1.0
        x-position: 4
      - name: itemsOnPage
        in: query
        required: true
        description: The number of results to include when paginating a large result set.
        schema:
          type: integer
          format: int32
          maximum: 100.0
          minimum: 1.0
        x-position: 5
      - name: isDescending
        in: query
        description: Change the direction of the default sort ordering.
        schema:
          type: boolean
          default: false
        x-position: 6
