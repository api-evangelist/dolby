              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                general:
                  summary: general
                  value:
                    status: error
                    message: simple error reason
                    code: 500
                    data:
                      additional: other data here (not actual key)
      deprecated: true
      security:
      - API_Secret: []
  /api/record_files/usage:
    get:
      tags:
      - RecordFiles
      summary: Usage
      description: '**Please refer to Usage**


        Get current total bytes of recorded files in storage.'
      operationId: RecordFiles_RecordFileUsage
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessRecordFileUsageModel'
        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                general:
                  summary: general
                  value:
                    status: error
                    message: simple error reason
                    code: 500
                    data:
                      additional: other data here (not actual key)
      deprecated: true
      security:
      - API_Secret: []
  /api/record_files/usage_billing:
    get:
      tags:
      - RecordFiles
      summary: Usage Billable
      description: '**Please refer to Usage Billable**


        Get total number of gigabyte hours of storage used within date range.'
      operationId: RecordFiles_RecordFileUsageBillable
      parameters:
      - name: startDate
        in: query
        required: true
        description: The start date of the query. In the format of `YYYY-MM-DD`.
        schema:
          type: string
          format: date
        x-position: 1
      - name: stopDate
        in: query
        required: true
        description: The exclusive end of the date range for the query. Data is returned up to, but not including, this date. In the format of `YYYY-MM-DD`. ISO 8601 format is also supported (e.g., 2021-02-01T00:00:00Z).
        schema:
          type: string
          format: date
        x-position: 2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessRecordFileBillableUsageModel'
        default:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                general:
                  summary: general
                  value:
                    status: error
                    message: simple error reason
                    code: 500
                    data:
                      additional: other data here (not actual key)
      deprecated: true
      security:
      - API_Secret: []
components:
  schemas:
    RecordFileModel:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        tokenId:
          type:
          - integer
          - 'null'
        token:
          type: string
        streamName:
          type: string
        recordedOn:
          type: string
          format: date-time
        removedOn:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/MediaAssetStatus2'
        metadata:
          oneOf:
          - $ref: '#/components/schemas/RecordMetadata'
        download:
          oneOf:
          - $ref: '#/components/schemas/RecordDownloadUrl2'
    MediaAssetStatus2:
      type: string
      description: ''
      x-enumNames:
      - Started
      - Transcode
      - InProgress
      - Deleted
      - Invalid
      - Expiring
      - Complete
      - Deleting
      - Error
      enum:
      - Started
      - Transcode
      - InProgress
      - Deleted
      - Invalid
      - Expiring
      - Complete
      - Deleting
      - Error
    SuccessResponseBoolean:
      type: object
      additionalProperties: false
      required:
      - status
      - data
      properties:
        status:
          type: string
          default: success
          minLength: 1
        data:
          type: boolean
    RecordMediaTrack:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
        codec:
          type: string
        bitrate:
          type: integer
        width:
          type:
          - integer
          - 'null'
          format: int32
        height:
          type:
          - integer
          - 'null'
          format: int32
        framerate:
          type:
          - integer
          - 'null'
          format: int32
        channels:
          type:
          - integer
          - 'null'
          format: int32
        samplerate:
          type:
          - integer
          - 'null'
          format: int64
    FailResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - data
      properties:
        status:
          type: string
          default: fail
          minLength: 1
        data: {}
    RemoveRecordFilesModel:
      type: object
      additionalProperties: false
      required:
      - recordFileIds
      properties:
        recordFileIds:
          type: array
          minItems: 1
          items:
            type: integer
    ListRecordFileModel:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        tokenId:
          type:
          - integer
          - 'null'
        token:
          type: string
        streamName:
          type: string
        recordedOn:
          type: string
          format: date-time
        removedOn:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/MediaAssetStatus2'
        metadata:
          oneOf:
          - $ref: '#/components/schemas/RecordMetadata'
    SuccessListRecordFileModel:
      type: object
      additionalProperties: false
      required:
      - status
      - data
      properties:
        status:
          type: string
          default: success
          minLength: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/ListRecordFileModel'
    RecordDownloadUrl2:
      type: object
      additionalProperties: false
      properties:
        downloadUrl:
          type: string
        downloadExpiresOn:
          type:
          - string
          - 'null'
          format: date-time
    SuccessRecordFileUsageModel:
      type: object
      additionalProperties: false
      required:
      - status
      - data
      properties:
        status:
          type: string
          default: success
          minLength: 1
        data:
          $ref: '#/components/schemas/RecordFileUsage'
    SuccessRecordFileBillableUsageModel:
      type: object
      additionalProperties: false
      required:
      - status
      - data
      properties:
        status:
          type: string
          default: success
          minLength: 1
        data:
          $ref: '#/components/schemas/RecordFileBillableUsage'
    SuccessRecordFileModel:
      type: object
      additionalProperties: false
      required:
      - status
      - data
      properties:
        status:
          type: string
          default: success
          minLength: 1
        data:
          $ref: '#/components/schemas/RecordFileModel'
    RecordMetadata:
      type: object
      additionalProperties: false
      required:
      - tracks
      - thumbnails
      properties:
        format:
          type: string
        sizes:
          type:
          - object
          - 'null'
          additionalProperties:
            type: integer
            format: uint64
        duration:
          type: integer
          description: Duration of this asset, in seconds.
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/RecordMediaTrack'
        thumbnails:
          type: array
          description: The list of thumbnails.
          items:
            type: string
        fileCount:
          type:
          - integer
          - 'null'
          description: The number of files.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - message
      properties:
        status:
          type: string
          default: error
          minLength: 1
        message:
          type: string
          minLength: 1
        code:
          type:
          - integer
          - 'null'
          format: int32
        data: {}
    RecordFileUsage:
      type: object
      additionalProperties: false
      properties:
        totalBytes:
          type: integer
          description: Total storage usage reported in bytes
          format: uint64
    FilterByRecordFileStatus:
      type: string
      description: ''
      x-enumFlags: true
      x-enumNames:
      - Started
      - Transcode
      - Complete
      - Deleting
      - Error
      enum:
      - Started
      - Transcode
      - Complete
      - Deleting
      - Error
    ListSortBy3:
      type: string
      description: ''
      x-enumNames:
      - RecordedOn
      - StreamName
      - Token
      enum:
      - RecordedOn
      - StreamName
      - Token
    RecordFileBillableUsage:
      type: object
      additionalProperties: false
      properties:
        gigabyteHours:
          type: integer
          description: Measured as binary gigabytes (1024^3) per hour
          format: uint64
