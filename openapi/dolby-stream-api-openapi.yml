components:
  schemas:
    ReprioritizeStreamRequest:
      type: object
      additionalProperties: false
      required:
      - tokenId
      - updatePriority
      properties:
        tokenId:
          type: integer
          description: 'Specify the token associated with stream that requires an updated priority.

            Please ensure that the token is assign a single streamId by calling [Read Token](#operation/PublishTokenV1_ReadToken), otherwise unexpected streams will be assigned the new priority on reconnection.'
        updatePriority:
          type: integer
          format: int32
    StopStreamRequest:
      type: object
      additionalProperties: false
      required:
      - streamId
      properties:
        streamId:
          type: string
          minLength: 1
    FailResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - data
      properties:
        status:
          type: string
          default: fail
          minLength: 1
        data: {}
    SuccessStopStreamResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - data
      properties:
        status:
          type: string
          default: success
          minLength: 1
        data:
          $ref: '#/components/schemas/LevelStreamStopped'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - message
      properties:
        status:
          type: string
          default: error
          minLength: 1
        message:
          type: string
          minLength: 1
        code:
          type:
          - integer
          - 'null'
          format: int32
        data: {}
    StreamStoppingLevel:
      type: string
      description: ''
      x-enumNames:
      - Account
      - Stream
      - Feed
      - Server
      - Token
      - None
      enum:
      - Account
      - Stream
      - Feed
      - Server
      - Token
      - None
    SuccessResponseOfReprioritizeStreamResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - data
      properties:
        status:
          type: string
          default: success
          minLength: 1
        data:
          $ref: '#/components/schemas/ReprioritizeStreamResponse'
    LevelStreamStopped:
      type: object
      additionalProperties: false
      properties:
        stoppingLevel:
          oneOf:
          - $ref: '#/components/schemas/StreamStoppingLevel'
    ReprioritizeStreamResponse:
      type: object
      additionalProperties: false
      properties:
        stoppingLevel:
          oneOf:
          - $ref: '#/components/schemas/StreamStoppingLevel'
  securitySchemes:
    API_Secret:
      type: http
      description: '### Usage

        #### Acquire secret from dashboard.

        * Login to the streaming dashboard

        * On the left menu, click on Settings

        * Navigate to the Security tab''s sub section API Secrets

        1. "+ Create" to generate a new named API Secret if needed

        2. Click on the copy button or the reveal button to access a previously created API Secret


        ![](../assets/api_secret.png "Find API Secret")'
      scheme: bearer
