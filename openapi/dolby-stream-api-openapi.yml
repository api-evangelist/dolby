  /api/stream/reprioritize:
    post:
      tags:
      - Stream
      summary: Reprioritize an active stream
      description: 'Update stream priority specified in token and restart stream to re-assign priority.


        Use List Tokens By Name and filter by `StreamName` to identify the tokenId associated with the target stream.'
      operationId: Stream_ReprioritizeStream
      requestBody:
        x-name: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprioritizeStreamRequest'
        required: true
        x-position: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseOfReprioritizeStreamResponse'
        '400':
          description: Bad Request
          content:
