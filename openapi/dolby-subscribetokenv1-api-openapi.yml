openapi: 3.2.0
info:
  title: Millicast Subscribe Token V1 API
  description: '# Introduction

    Controlling publishing for your Millicast account.'
  version: 1.0.0
servers:
- url: https://api.millicast.com
security:
- API_Secret: []
tags:
- name: SubscribeTokenV1
paths:
  /api/subscribe_token/{tokenId}:
    get:
      tags:
      - SubscribeTokenV1
      summary: Read Token
      description: Gets token specified by token id.
      operationId: SubscribeTokenV1_ReadToken
      parameters:
      - name: tokenId
        in: path
        required: true
        schema:
          type: integer
        x-position: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseSubscribeTokenV1'
              examples:
                simple:
                  summary: simple
                  value:
                    status: success
                    data:
                      allowedCountries: []
                      deniedCountries: []
                      name: new_label_name
                      id: 75248
                      label: label_no_586
                      token: my-magic-token-82
                      addedOn: '2024-12-03T02:43:50Z'
                      isActive: true
                      streams:
                      - streamName: master_stream
                        isRegex: false
                      - streamName: stream1
                        isRegex: false
                      allowedOrigins: []
                      allowedIpAddresses: []
                      originCluster: ''
                      effectiveSettings:
                        originCluster: auto
                        allowedCountries: []
                        deniedCountries: []
                regex:
                  summary: regex
                  value:
                    status: success
                    data:
                      allowedCountries: []
                      deniedCountries: []
                      name: new_regex_token_name
                      id: 69050
                      label: label_no_254
                      token: my-magic-token-57
                      addedOn: '2024-12-03T00:53:13Z'
                      isActive: true
                      streams:
                      - streamName: Cooked or Cooking??
                        isRegex: false
                      - streamName: newStream1
                        isRegex: false
                      - streamName: special_regex_stream[0-9]+
                        isRegex: true
                      allowedOrigins: []
                      allowedIpAddresses: []
                      originCluster: ''
                      effectiveSettings:
                        originCluster: auto
                        allowedCountries: []
                        deniedCountries: []
                expiring:
                  summary: expiring
                  value:
                    status: success
                    data:
                      allowedCountries: []
                      deniedCountries: []
                      name: token that expires
                      id: 74061
                      label: label_no_649
                      token: my-magic-token-17
                      addedOn: '2024-12-03T05:14:33Z'
                      expiresOn: '2024-12-10T05:14:21Z'
                      isActive: true
                      streams:
                      - streamName: temp stream
                        isRegex: false
                      allowedOrigins: []
                      allowedIpAddresses: []
                      originCluster: ''
                      effectiveSettings:
