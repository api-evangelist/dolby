method: searched
source: >-
  registry.npmjs.org, pypi.org, api.nuget.org, search.maven.org, pub.dev and trunk.cocoapods.org
  metadata endpoints, cross-checked against the Dolby OptiView SDK documentation
  (https://optiview.dolby.com/docs/) and the first-party GitHub organizations
  github.com/THEOplayer, github.com/millicast and github.com/DolbyIO.
provider: Dolby
providerId: dolby
note: >-
  Dolby OptiView is the merged surface of three acquisitions - THEO Technologies (THEOplayer,
  THEOlive, THEOads), Millicast (real-time streaming) and the original dolby.io platform - so the
  first-party SDKs are published under three different registry scopes: @theoplayer/*, @millicast/*
  and @dolbyio/*. npm maintainer accounts confirm first-party ownership: theotechnologies-admin,
  fabien-dolbyio, dolbyio_sa, cjohnsto.
  CURRENCY FINDING: the REST-API client libraries have decayed unevenly. The Node client
  (@dolbyio/dolbyio-rest-apis-client 6.3.1, 2026-07-14) is current; the Python client last shipped
  2024-08-20 and the .NET client 2023-06-19, both more than a year behind the APIs they wrap, and
  the Millicast REST API changed enough in that window that 30 of its operations are now marked
  deprecated in the live spec.
