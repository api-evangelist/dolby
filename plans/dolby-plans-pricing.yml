supersedes: >-
  A scaffold written by the 2026-05-04 bulk sweep that invented a Free / Professional /
  Enterprise ladder with 1,000 and 100,000 request quotas and 10/100/1000 rpm limits. Dolby
  publishes none of that. It has been replaced entirely by what the pricing page actually says.
plan_count: 3
description: >-
  Dolby OptiView publishes three named plans - Streaming, Playback and Advertising - which can be
  bought standalone or bundled. ALL THREE ARE "Custom pricing" with a "Request pricing" call to
  action. No price, no currency, no billing period, no included quota, no overage rate and no
  per-tier limit is published anywhere on the site. There is no free tier and no self-serve
  signup: every path to the API goes through a contact form.
